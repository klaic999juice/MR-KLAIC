<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A premium website editor with live HTML preview and modern SaaS design."
    />
    <title>Nova Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>

    <div class="app-shell">
      <header class="topbar glass-panel">
        <div class="brand-wrap">
          <div class="brand-mark">N</div>
          <div class="brand-copy">
            <p class="eyebrow">website editor</p>
            <h1>Nova Studio</h1>
          </div>
        </div>

        <nav class="topnav" aria-label="Main navigation">
          <span class="nav-pill active">Designer</span>
          <span class="nav-pill">Templates</span>
          <span class="nav-pill">Exports</span>
        </nav>

        <div class="toolbar">
          <label class="field-inline" aria-label="Page title input">
            <span>Title</span>
            <input id="pageTitle" type="text" value="Build launches people remember" />
          </label>

          <label class="field-inline color-field" aria-label="Accent color picker">
            <span>Accent</span>
            <input id="accentColor" type="color" value="#7c3aed" />
          </label>

          <button id="themeToggle" class="ghost-btn" type="button">Dark mode</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel glass-panel editor-panel">
          <div class="panel-header">
            <div class="header-title">
              <span class="status-dot"></span>
              <h2>Code editor</h2>
            </div>

            <div class="button-row">
              <button id="applyBtn" class="primary-btn" type="button">Apply</button>
              <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
            </div>
          </div>

          <textarea id="htmlEditor" spellcheck="false" aria-label="HTML editor"></textarea>
        </section>

        <section class="panel glass-panel preview-panel">
          <div class="panel-header">
            <div class="header-title">
              <span class="status-dot success"></span>
              <h2>Live preview</h2>
            </div>

            <div class="button-row">
              <button id="copyBtn" class="ghost-btn" type="button">Copy code</button>
              <button id="downloadBtn" class="primary-btn" type="button">Download</button>
            </div>
          </div>

          <div id="preview" class="preview-frame" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
